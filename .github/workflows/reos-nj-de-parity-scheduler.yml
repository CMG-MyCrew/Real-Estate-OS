name: REOS NJ DE Philadelphia Parity Shadow Scheduler
on:
  push:
    branches:
      - feature/nj-de-philadelphia-parity-shadow-20261108
  pull_request:
    paths:
      - 'src/NJDECountyParityScheduler.gs'
      - 'scripts/test-nj-de-pa-parity-scheduler.mjs'
      - 'scripts/reos-nj-de-pa-parity-consolidated-audit.py'
      - 'config/nj-de-philadelphia-parity-feed-catalog.json'
      - '.github/workflows/reos-nj-de-parity-scheduler.yml'
permissions:
  contents: read
jobs:
  nj-de-pa-parity-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline source and safety invariants
        run: node scripts/test-nj-de-pa-parity-scheduler.mjs
      - name: Consolidated 24-county 120-feed local audit and ZIP evidence
        env:
          REOS_RELEASE_PIN: ${{ github.sha }}
        run: python3 scripts/reos-nj-de-pa-parity-consolidated-audit.py --output-dir "$RUNNER_TEMP"
