<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --navy:#10233f; --blue:#1f5fae; --green:#16794b; --red:#b3261e; --line:#d9e1ea; --bg:#f5f7fa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:#172033; }
    .header { padding:16px; color:#fff; background:linear-gradient(135deg,var(--navy),var(--blue)); }
    .header h1 { margin:0; font-size:20px; }
    .header p { margin:6px 0 0; font-size:12px; opacity:.9; }
    .wrap { padding:14px; }
    .section { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:12px; padding:12px; }
    .section h2 { margin:0 0 10px; font-size:14px; color:var(--navy); }
    label { display:block; font-size:11px; font-weight:700; margin:0 0 4px; }
    input, select, textarea { width:100%; border:1px solid #b9c5d3; border-radius:6px; padding:8px; font-size:13px; background:#fff; }
    input:focus, select:focus, textarea:focus { outline:2px solid #9bc3f3; border-color:var(--blue); }
    textarea { min-height:58px; resize:vertical; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .field { min-width:0; }
    .full { grid-column:1/-1; }
    .deal-card { margin-top:8px; padding:9px; border-radius:7px; background:#eef4fb; font-size:12px; line-height:1.45; }
    .checks { display:grid; gap:8px; }
    .check { display:flex; gap:8px; align-items:center; font-size:12px; }
    .check input { width:auto; }
    .actions { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:8px 0 2px; }
    button { flex:1; border:0; border-radius:7px; padding:10px; font-weight:700; cursor:pointer; }
    .preview { background:#dce9f8; color:var(--navy); }
    .save { background:var(--green); color:#fff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .status { display:none; margin-bottom:10px; padding:9px; border-radius:7px; font-size:12px; white-space:pre-wrap; }
    .status.show { display:block; }
    .status.info { background:#e8f1fb; color:#173d6b; }
    .status.success { background:#e1f3e8; color:#155b38; }
    .status.error { background:#fde8e7; color:var(--red); }
    .metrics { display:none; grid-template-columns:1fr 1fr; gap:8px; }
    .metrics.show { display:grid; }
    .metric { padding:9px; border:1px solid var(--line); border-radius:7px; background:#fafbfd; }
    .metric span { display:block; font-size:10px; color:#64748b; text-transform:uppercase; }
    .metric strong { display:block; margin-top:3px; font-size:15px; }
    .wide { grid-column:1/-1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>REOS Deal Analyzer</h1>
    <p>Analyze a real property, save the results, score the deal, and create a draft offer.</p>
  </div>
  <div class="wrap">
    <div id="status" class="status"></div>

    <div class="section">
      <h2>1. Select Deal</h2>
      <select id="dealId" onchange="loadDeal()"><option value="">Loading deals…</option></select>
      <div id="dealCard" class="deal-card">Select a deal to load its property details and latest analysis.</div>
    </div>

    <div class="section">
      <h2>2. Acquisition & Exit Assumptions</h2>
      <div class="grid">
        <div class="field"><label>Purchase Price *</label><input id="purchasePrice" inputmode="decimal" placeholder="$95,000"></div>
        <div class="field"><label>ARV *</label><input id="arv" inputmode="decimal" placeholder="$165,000"></div>
        <div class="field"><label>Repair Cost *</label><input id="repairCost" inputmode="decimal" placeholder="$25,000"></div>
        <div class="field"><label>Assignment Fee</label><input id="assignmentFee" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Holding Cost</label><input id="holdingCost" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Closing Cost</label><input id="closingCost" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Financing Cost</label><input id="financingCost" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Selling Cost</label><input id="sellingCost" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>MAO %</label><input id="maoPercent" inputmode="decimal" value="70"></div>
        <div class="field"><label>Operating Expense %</label><input id="operatingExpensePercent" inputmode="decimal" value="16"></div>
      </div>
    </div>

    <div class="section">
      <h2>3. Rental Assumptions</h2>
      <div class="grid">
        <div class="field"><label>Monthly Rent</label><input id="rentMonthly" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Monthly Loan Payment</label><input id="loanPaymentMonthly" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Annual Taxes</label><input id="taxesAnnual" inputmode="decimal" placeholder="$0"></div>
        <div class="field"><label>Annual Insurance</label><input id="insuranceAnnual" inputmode="decimal" placeholder="$0"></div>
        <div class="field full"><label>Monthly HOA</label><input id="hoaMonthly" inputmode="decimal" placeholder="$0"></div>
      </div>
    </div>

    <div class="section">
      <h2>4. Workflow Options</h2>
      <div class="grid">
        <div class="field"><label>Offer Type</label><select id="offerType"><option>Cash</option><option>Financed</option><option>Seller Finance</option><option>Subject To</option></select></div>
        <div class="field full"><label>Offer Terms</label><textarea id="offerTerms" placeholder="Optional offer terms or contingencies"></textarea></div>
      </div>
      <div class="checks">
        <label class="check"><input id="createDraftOffer" type="checkbox" checked> Create or reuse a draft offer</label>
        <label class="check"><input id="advancePipeline" type="checkbox" checked> Advance pipeline to Initial Analysis</label>
      </div>
    </div>

    <div class="section">
      <h2>Analysis Preview</h2>
      <div id="metrics" class="metrics"></div>
    </div>

    <div class="actions">
      <button id="previewBtn" class="preview" onclick="previewDeal()">Preview</button>
      <button id="saveBtn" class="save" onclick="saveDeal()">Save Analysis</button>
    </div>
  </div>

<script>
  const moneyFields = ['purchasePrice','arv','repairCost','holdingCost','closingCost','financingCost','sellingCost','assignmentFee','rentMonthly','taxesAnnual','insuranceAnnual','hoaMonthly','loanPaymentMonthly'];

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    setBusy(true);
    google.script.run
      .withSuccessHandler(data => {
        const select = document.getElementById('dealId');
        select.innerHTML = '<option value="">Select a deal…</option>' + data.deals.map(d => `<option value="${esc(d.dealId)}">${esc(d.label)}</option>`).join('');
        applyValues(data.defaults || {});
        setBusy(false);
      })
      .withFailureHandler(showError)
      .reosDealAnalyzerGetInitialData();
  }

  function loadDeal() {
    const dealId = value('dealId');
    if (!dealId) {
      document.getElementById('dealCard').textContent = 'Select a deal to load its property details and latest analysis.';
      return;
    }
    setBusy(true);
    showStatus('Loading deal…', 'info');
    google.script.run
      .withSuccessHandler(data => {
        const d = data.deal || {};
        document.getElementById('dealCard').innerHTML = `<strong>${esc(d.Address || 'Unnamed property')}</strong><br>${esc([d.City,d.State,d.Zip].filter(Boolean).join(', '))}<br>Source: ${esc(d.Source || '—')} · Status: ${esc(d['Deal Status'] || '—')}`;
        if (data.form) applyValues(data.form);
        showStatus(data.latestAnalysis ? 'Latest saved analysis loaded.' : 'No previous analysis found. Enter assumptions below.', 'info');
        setBusy(false);
      })
      .withFailureHandler(showError)
      .reosDealAnalyzerGetDealContext(dealId);
  }

  function requestPayload() {
    const analysis = {};
    moneyFields.forEach(id => analysis[id] = value(id));
    analysis.maoPercent = value('maoPercent');
    analysis.operatingExpensePercent = value('operatingExpensePercent');
    return {
      dealId: value('dealId'),
      analysis,
      options: {
        createDraftOffer: document.getElementById('createDraftOffer').checked,
        advancePipeline: document.getElementById('advancePipeline').checked,
        offerType: value('offerType'),
        offerTerms: value('offerTerms')
      }
    };
  }

  function previewDeal() {
    setBusy(true);
    showStatus('Calculating preview…', 'info');
    google.script.run
      .withSuccessHandler(data => {
        renderMetrics(data.metrics || {});
        showStatus('Preview calculated. Review the metrics, then save the analysis.', 'success');
        setBusy(false);
      })
      .withFailureHandler(showError)
      .reosDealAnalyzerPreview(requestPayload());
  }

  function saveDeal() {
    if (!value('dealId')) return showStatus('Select a deal before saving.', 'error');
    setBusy(true);
    showStatus('Saving analysis and updating REOS…', 'info');
    google.script.run
      .withSuccessHandler(data => {
        const result = data.result || {};
        const analysis = result.analysis || {};
        if (analysis.MAO !== undefined) renderMetrics({
          mao: analysis.MAO,
          flipProfit: analysis['Flip Profit'],
          roi: analysis['ROI %'],
          cashRequired: analysis['Cash Required'],
          noi: analysis.NOI,
          capRate: analysis['Cap Rate %'],
          dscr: analysis.DSCR,
          recommendation: analysis.Recommendation,
          riskLevel: analysis['Risk Level']
        });
        showStatus(data.message || 'Deal analysis saved successfully.', 'success');
        setBusy(false);
      })
      .withFailureHandler(showError)
      .reosDealAnalyzerSubmit(requestPayload());
  }

  function renderMetrics(m) {
    const items = [
      ['MAO', currency(m.mao)], ['Flip Profit', currency(m.flipProfit)],
      ['ROI', percent(m.roi)], ['Cash Required', currency(m.cashRequired)],
      ['NOI', currency(m.noi)], ['Cap Rate', percent(m.capRate)],
      ['DSCR', num(m.dscr)], ['Risk', m.riskLevel || '—'],
      ['Recommendation', m.recommendation || '—']
    ];
    const box = document.getElementById('metrics');
    box.innerHTML = items.map((x,i) => `<div class="metric ${i===8?'wide':''}"><span>${esc(x[0])}</span><strong>${esc(String(x[1]))}</strong></div>`).join('');
    box.classList.add('show');
  }

  function applyValues(data) {
    Object.keys(data || {}).forEach(key => {
      const el = document.getElementById(key);
      if (!el) return;
      if (el.type === 'checkbox') el.checked = Boolean(data[key]);
      else el.value = data[key] === null || data[key] === undefined ? '' : data[key];
    });
  }

  function value(id) { return document.getElementById(id).value.trim(); }
  function currency(v) { const n = Number(v || 0); return n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}); }
  function percent(v) { return `${Number(v || 0).toFixed(2)}%`; }
  function num(v) { return Number(v || 0).toFixed(2); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>'"]/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

  function setBusy(busy) {
    document.getElementById('previewBtn').disabled = busy;
    document.getElementById('saveBtn').disabled = busy;
  }

  function showStatus(message, type) {
    const box = document.getElementById('status');
    box.textContent = message;
    box.className = `status show ${type || 'info'}`;
  }

  function showError(error) {
    setBusy(false);
    showStatus(error && error.message ? error.message : String(error), 'error');
  }
</script>
</body>
</html>
